<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar Store Demo</title>
<style>body{margin:0;background:#f6f5f1;color:#242a30;font:16px system-ui}header{padding:22px 6%;background:#172b35;color:white;display:flex;justify-content:space-between}main{max-width:1000px;margin:35px auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}.card,.cart{background:white;border:1px solid #e5e3dc;border-radius:16px;padding:20px}.art{height:125px;border-radius:12px;background:linear-gradient(135deg,#d7e5dc,#f0d9bc);display:grid;place-items:center;font-size:40px}.price{font-weight:800}button{background:#b65f3e;color:white;border:0;padding:10px 14px;border-radius:9px;cursor:pointer}.muted{color:#68727a}.back{color:#b65f3e}</style>
<header><strong>NORTHSTAR / DEMO SHOP</strong><span>Cart: <b id="count">0</b></span></header><main><a class="back" href="../index.html">← Back to portfolio</a><p class="muted">INDEPENDENT PORTFOLIO DEMO · Sample products only; no checkout or payments.</p><h1>Everyday essentials, thoughtfully selected.</h1><div class="grid" id="products"></div><div class="cart"><h2>Your demo cart</h2><p id="cart">Your cart is empty.</p><strong id="total">Total: $0.00</strong></div></main>
<script>
const items=[['Desk Lamp','Warm, adjustable lighting',34.00,'💡'],['Everyday Bottle','Reusable stainless bottle',22.50,'🧴'],['Notebook Set','Three premium paper notebooks',16.00,'📓']];
let cart=[];document.getElementById('products').innerHTML=items.map((p,i)=>`<article class="card"><div class="art">${p[3]}</div><h2>${p[0]}</h2><p class="muted">${p[1]}</p><p class="price">$${p[2].toFixed(2)}</p><button onclick="add(${i})">Add to cart</button></article>`).join('');
function add(i){cart.push(items[i]);draw()}function draw(){document.getElementById('count').textContent=cart.length;document.getElementById('cart').textContent=cart.length?cart.map(x=>x[0]).join(', '):'Your cart is empty.';document.getElementById('total').textContent='Total: $'+cart.reduce((s,x)=>s+x[2],0).toFixed(2)}draw();
</script></html>
