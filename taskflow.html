<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow Dashboard Demo</title>
<style>
body{margin:0;background:#f4f6fb;color:#172033;font:16px system-ui}main{max-width:900px;margin:45px auto;padding:20px}.box{background:white;border:1px solid #e3e8f1;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 8px 30px #15264a0b}h1{margin-bottom:4px}.muted{color:#667085}.row{display:flex;gap:10px;flex-wrap:wrap}input,select,button{padding:11px;border:1px solid #ccd4e0;border-radius:9px;font:inherit}button{background:#145e50;color:white;border:0;cursor:pointer}.task{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf0f5}.done{text-decoration:line-through;color:#8993a4}.pill{font-size:12px;color:#145e50;background:#e4f5ef;padding:4px 8px;border-radius:20px}.back{color:#145e50}
</style><main><a class="back" href="../index.html">← Back to portfolio</a><p class="pill">INDEPENDENT PORTFOLIO DEMO</p><h1>TaskFlow</h1><p class="muted">A lightweight task dashboard concept with task creation, status updates and filtering. Demo data is stored in this page only.</p>
<div class="box"><h2>Add a task</h2><div class="row"><input id="taskInput" placeholder="What needs to be done?" style="flex:1;min-width:220px"><select id="priority"><option>Normal</option><option>High</option><option>Low</option></select><button onclick="addTask()">Add task</button></div></div>
<div class="box"><div class="row" style="justify-content:space-between;align-items:center"><h2>My tasks</h2><select id="filter" onchange="render()"><option value="all">All tasks</option><option value="open">To do</option><option value="done">Completed</option></select></div><div id="tasks"></div></div>
<script>
let tasks=[{name:"Plan the project",priority:"High",done:false},{name:"Review interface layout",priority:"Normal",done:true},{name:"Prepare handoff notes",priority:"Low",done:false}];
function render(){let f=document.getElementById('filter').value;document.getElementById('tasks').innerHTML=tasks.filter(t=>f==='all'||(f==='done'?t.done:!t.done)).map((t,i)=>`<div class="task"><label><input type="checkbox" ${t.done?'checked':''} onchange="toggle(${tasks.indexOf(t)})"> <span class="${t.done?'done':''}">${t.name}</span></label><span class="pill">${t.priority}</span></div>`).join('')||'<p class="muted">No tasks in this view.</p>'}
function addTask(){let el=document.getElementById('taskInput'),name=el.value.trim();if(!name)return;tasks.unshift({name,priority:document.getElementById('priority').value,done:false});el.value='';render()}
function toggle(i){tasks[i].done=!tasks[i].done;render()}render();
</script></main></html>
